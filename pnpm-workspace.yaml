packages:
  - "product/apps/*"
  - "product/packages/*"

overrides:
  "@types/react": "19.2.14"
  "@types/react-dom": "19.2.3"
  xmlbuilder: "15.0.0"
  resolve: "1.22.10"
  react: "19.1.0"
  react-dom: "19.1.0"

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

confirmModulesPurge: false

# Hoisted node_modules avoids Metro / native tooling missing deps under pnpm’s isolated
# layout (see https://docs.expo.dev/guides/monorepos/#package-managers-with-isolated-dependencies).
nodeLinker: hoisted
